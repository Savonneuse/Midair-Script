[package]
name = "midair-rs"
version = "1.0.0"
edition = "2024"
description = "Script Midair - calculateur de ratio sand/hammer pour canons TNT"
authors = ["ANX"]

[[bin]]
name = "ScriptMidair"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = { version = "0.17", default-features = false, features = [
    "common-controls-v6",
] }
image = { version = "0.25", default-features = false, features = ["ico"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_Security",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
